[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dntscout"
version = "0.1.0"
description = "Structure-to-network developmental neurotoxicity triage with calibrated uncertainty"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Francisco Angulo de Lafuente" }]
dependencies = ["rdkit", "scikit-learn", "numpy", "pandas", "pyarrow", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
